# ===== RaskolLumber =====
regrow-seconds: 600         # через сколько вырастет новое дерево (600 = 10 мин)
require-axe: true           # рубить можно только топором
allow-player-drop: true     # выпадает ли бревно/листва игроку (false — нет, но регенерация всё равно)

# Материалы, считающиеся топорами.
axes:
  - WOODEN_AXE
  - STONE_AXE
  - IRON_AXE
  - GOLDEN_AXE
  - DIAMOND_AXE
  - NETHERITE_AXE

# Материалы, считающиеся брёвнами.
logs:
  - OAK_LOG
  - SPRUCE_LOG
  - BIRCH_LOG
  - JUNGLE_LOG
  - ACACIA_LOG
  - DARK_OAK_LOG
  - MANGROVE_LOG
  - CHERRY_LOG
