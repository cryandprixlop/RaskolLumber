# ===== RaskolLumber =====
regrow-seconds: 600         # через сколько вырастет новое дерево (600 = 10 мин)
require-axe: true           # регенерация в зоне только при рубке топором
allow-player-drop: true     # выпадать ли брёвна игроку (false — нет, регенерация всё равно)

# Материалы-топоры (для рубки и бонусов)
axes:
  - WOODEN_AXE
  - STONE_AXE
  - IRON_AXE
  - GOLDEN_AXE
  - DIAMOND_AXE
  - NETHERITE_AXE

# Материалы-бревна (считаются деревом)
logs:
  - OAK_LOG
  - SPRUCE_LOG
  - BIRCH_LOG
  - JUNGLE_LOG
  - ACACIA_LOG
  - DARK_OAK_LOG
  - MANGROVE_LOG
  - CHERRY_LOG

# ===== Топоры дровосека =====
axe:
  craft-success-chance: 25.0   # шанс крафта топора из 3 фрагментов

# Шансы лута при рубке дерева (одна рулетка на дерево)
loot:
  vanilla:            # обычный ванильный топор
    golden-chance: 0.001
    next-fragment-chance: 5.0
    double-chance: 2.0
  improved:           # Улучшенный топор
    golden-chance: 0.002
    next-fragment-chance: 4.0
    double-chance: 4.0
  lumberjack:         # Топор дровосека
    golden-chance: 0.01
    next-fragment-chance: 4.0
    double-chance: 20.0
  olaf:               # Топор Олафа
    golden-chance: 0.5
    double-chance: 35.0
    triple-chance: 15.0
    quad-chance: 10.0
